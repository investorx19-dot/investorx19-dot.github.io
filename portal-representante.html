<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark6 - Portal do Representante</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.5rem; color: var(--primary); }
    
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; width: 100%; flex: 1; }
    
    /* Ecrã de Login */
    #login-screen { max-width: 400px; margin: 80px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    #login-screen h2 { margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text); }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--primary-hover); }

    /* Painel do Representante */
    .dashboard { display: none; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
    .card h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px; }
    .card .value { font-size: 1.8rem; font-weight: bold; color: var(--success); }

    .link-box { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .link-box input { flex: 1; padding: 10px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
    .link-box button { width: auto; padding: 10px 20px; }

    table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
    tr:last-child td { border-bottom: none; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Mark6 - Portal do Parceiro</h1>
    <button id="btn-logout" class="hidden" style="width: auto; padding: 8px 15px; background: #ef4444;">Sair</button>
  </header>

  <div class="container">
    
    <!-- SECÇÃO DE LOGIN -->
    <div id="login-screen">
      <h2>Acesso ao Portal</h2>
      <form id="form-login">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="email" required placeholder="seu.email@exemplo.com">
        </div>
        <div class="form-group">
          <label>Palavra-passe</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="button" onclick="tentarLogar()">Entrar no Portal</button>
      </form>
    </div>

    <!-- PAINEL DO REPRESENTANTE -->
    <div id="dashboard-screen" class="dashboard">
      <h2 id="welcome-msg" style="margin-bottom: 20px;">Bem-vindo, Parceiro!</h2>

      <!-- Link de Indicação Exclusivo -->
      <div class="link-box">
        <div style="flex: 1;">
          <label style="display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.85rem;">O seu Link de Indicação Exclusivo (?ref=):</label>
          <input type="text" id="ref-link" readonly value="A carregar link...">
        </div>
        <button id="btn-copiar" type="button" style="margin-top: 20px;">Copiar Link</button>
      </div>

      <!-- Métricas -->
      <div class="metrics-grid">
        <div class="card">
          <h3>Leads Capturados</h3>
          <div class="value" id="stat-leads">0</div>
        </div>
        <div class="card">
          <h3>Comissões Pendentes</h3>
          <div class="value" id="stat-comissao-pendente">R$ 0,00</div>
        </div>
      </div>

      <!-- Tabela de Leads Indicados -->
      <h3 style="margin-bottom: 15px;">Os seus Leads Registados</h3>
      <table>
        <thead>
          <tr>
            <th>Nome do Lead</th>
            <th>Tipo (B2C/B2B)</th>
            <th>Estágio Atual</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="tabela-leads-corpo">
          <tr>
            <td colspan="4" style="text-align: center; color: var(--text-muted);">A carregar os seus dados...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Firebase SDKs compatíveis com o projeto -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

 <!-- Firebase SDKs Modulares -->
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

  // Configuração do Firebase
const firebaseConfig = {
  apiKey: "AIzaSyA9ccyTSDoWiqrwnq9K7nAEjeOHZahKIu0",
  authDomain: "painel-megasena.firebaseapp.com",
  projectId: "painel-megasena",
  storageBucket: "painel-megasena.firebasestorage.app",
  messagingSenderId: "924943702876",
  appId: "1:924943702876:web:77929086c5addb13b37f99"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Monitora o estado da sessão do representante
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      console.log("Usuário autenticado:", user.email);
      await carregarComissoesRepresentante(user.email);
    } else {
      console.log("Nenhum usuário logado. Redirecionando...");
      // Se não estiver logado, redireciona ou exibe tela de login
    }
  });

  // Função para buscar e renderizar os dados do Firestore na tabela
  async function carregarComissoesRepresentante(email) {
    try {
      const q = query(collection(db, "crm_oportunidades"), where("representanteEmail", "==", email));
      const querySnapshot = await getDocs(q);
      
      const tabela = document.getElementById("tabela-comissoes");
      if (!tabela) return;
      
      tabela.innerHTML = "";
      
      if (querySnapshot.empty) {
        tabela.innerHTML = `<tr><td colspan="3" style="text-align: center;">Nenhuma oportunidade encontrada.</td></tr>`;
        return;
      }

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${data.clienteNome || "Cliente"}</td>
          <td>${data.status || "Ativo"}</td>
          <td>R$ ${data.comissao ? data.comissao.toFixed(2) : "0,00"}</td>
        `;
        tabela.appendChild(tr);
      });
    } catch (error) {
      console.error("Erro ao buscar dados do Firestore:", error);
    }
  }

  // Função para capturar os dados dos inputs e iniciar o login
  window.tentarLogar = async function() {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("password").value; // Ajustado para o id 'password' do seu input
    
    await window.fazerLogin(email, senha);
  };

  // Função de autenticação do Firebase
  window.fazerLogin = async function(email, senha) {
    try {
      await signInWithEmailAndPassword(auth, email, senha);
      alert("Login realizado com sucesso!");
      
      // Redireciona para o painel interno após o sucesso
      window.location.href = "painel-representante.html";
      
    } catch (error) {
      console.error("Erro no login:", error.message);
      alert("Erro ao entrar: " + error.message);
    }
  };

  // Exemplo de função para o botão Sair
  window.fazerLogout = async function() {
    await signOut(auth);
    window.location.reload();
  };
</script>
</body>
</html>
